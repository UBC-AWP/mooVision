site_name: MooVision

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
    
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            docstring_style: numpy

nav:
  - Home: index.md
  - Model Pipeline:
    - Splitting Data: Training/data_splitting.md
    - Preprocessing: Training/preprocessing.md
    - Baseline: baseline.md
    - Model Evaluation: evaluation.md
    - Clipping: clipping.md
  - Utils:
    - Utils: utils/get_video.md
  - About:
    - About: about/about.md
    - License: about/license.md
    - Release Notes: about/release_notes.md
