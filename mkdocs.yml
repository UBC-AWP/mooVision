site_name: MooVision

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
    
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true