[project]
name = "moovision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.12",
    "matplotlib>=3.10.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "ultralytics>=8.4.51",
    # --- DYNAMIC PYTORCH ROUTING MATRIX ---
    # On the Sockeye Cluster (Linux), target stable production weights
    "torch==2.5.1; sys_platform == 'linux'",
    "torchvision==0.20.1; sys_platform == 'linux'",
    # On your laptop (Mac/Windows), pull down the native mainstream version
    "torch; sys_platform == 'darwin'",
    "torchvision; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

# Register the official PyTorch CUDA index repository
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]